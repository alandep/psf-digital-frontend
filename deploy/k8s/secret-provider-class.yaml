# PROPOSTO — NÃO APLICAR. Etapa 4 (fase faturável), após aprovação do usuário.
#
# Materializa o K8s Secret `eip-db-credentials` a partir do Secret Manager usando o
# Secret Manager add-on GERENCIADO do GKE (secrets-store.csi.k8s.io + provider gcp).
# NÃO é o CSI genérico instalado à mão — é o add-on gerenciado habilitado no cluster na Etapa 4.
#
# Consumo via `secretObjects` (sincroniza para K8s Secret) para PRESERVAR o contrato de ENV do
# Spring (DB_PASSWORD / REPORTING_DB_PASSWORD via secretKeyRef), sem reescrever o backend.
#
# Apenas as SENHAS são secret. Os usernames (eip_app / eip_report) são literais no deployment.yaml.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: eip-db-credentials-spc
  namespace: default
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/eip-ai-prod/secrets/eip-db-app-password/versions/latest"
        path: "db-password"
      - resourceName: "projects/eip-ai-prod/secrets/eip-db-reporting-password/versions/latest"
        path: "reporting-db-password"
  # Sincroniza os valores montados para o K8s Secret `eip-db-credentials`.
  secretObjects:
    - secretName: eip-db-credentials
      type: Opaque
      data:
        - objectName: "db-password"
          key: "db-password"
        - objectName: "reporting-db-password"
          key: "reporting-db-password"
