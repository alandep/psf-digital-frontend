# KSA (Kubernetes Service Account) usada pelo pod do backend.
# Vinculada à GSA (Google Service Account) eip-pod via Workload Identity.
# Este arquivo NÃO cria nada por si só — é aplicado apenas na fase faturável (💲),
# e o binding IAM KSA<->GSA é provisionado pela IaC (deploy/infra/).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eip-ksa
  namespace: default
  annotations:
    # Workload Identity: associa esta KSA à GSA de produção (placeholder; não cria IAM).
    # O binding roles/iam.workloadIdentityUser é feito na IaC.
    iam.gke.io/gcp-service-account: eip-pod@eip-ai-prod.iam.gserviceaccount.com
