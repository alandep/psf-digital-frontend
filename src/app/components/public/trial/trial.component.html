<div class="trial-page">
  <div class="trial-card">
    <div class="badge">14 dias grátis</div>
    <h1 class="title">Experimente o EIP por 14 dias</h1>
    <p class="subtitle">Conheça a plataforma antes de contratar.</p>

    <ul class="feature-list">
      <li *ngFor="let f of features">
        <mat-icon>check_circle</mat-icon>
        <span>{{ f }}</span>
      </li>
    </ul>

    <p class="no-card">
      <mat-icon>credit_card_off</mat-icon>
      Não exige cartão para começar.
    </p>

    <div class="actions">
      <button mat-flat-button color="primary" class="primary-btn" (click)="startTrial()" [disabled]="entering">
        <mat-spinner *ngIf="entering" diameter="18" class="btn-spinner"></mat-spinner>
        <span *ngIf="!entering">Começar meu teste</span>
        <span *ngIf="entering">Entrando…</span>
      </button>
      <a mat-stroked-button color="primary" routerLink="/precos">Ver planos</a>
    </div>
  </div>
</div>
