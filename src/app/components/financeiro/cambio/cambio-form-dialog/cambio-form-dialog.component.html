<div class="cambio-form-dialog">
  <div class="form-header" mat-dialog-title>
    <div class="form-title-section">
      <mat-icon class="form-icon">currency_exchange</mat-icon>
      <div>
        <h2>Novo Contrato de Câmbio</h2>
        <p>Preencha os dados para registrar o contrato</p>
      </div>
    </div>
    <button mat-icon-button mat-dialog-close aria-label="Fechar">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content>
    <form [formGroup]="form" class="cambio-form">
      <div class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Operação</mat-label>
          <mat-select formControlName="side">
            <mat-option value="VENDA">Venda (exportação)</mat-option>
            <mat-option value="COMPRA">Compra</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Banco</mat-label>
          <mat-select formControlName="bank">
            <mat-option *ngFor="let b of banks" [value]="b">{{ b }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Moeda</mat-label>
          <mat-select formControlName="currency">
            <mat-option *ngFor="let c of currencies" [value]="c">{{ c }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Valor ME</mat-label>
          <input matInput type="number" formControlName="foreignValue" placeholder="Valor na moeda estrangeira">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Taxa de Câmbio</mat-label>
          <input matInput type="number" step="0.0001" formControlName="exchangeRate" placeholder="Cotação do dia">
          <mat-hint *ngIf="taxaInfo">{{ taxaInfo }}</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Data de contratação</mat-label>
          <input matInput [matDatepicker]="pickerClosing" formControlName="closingDate">
          <mat-datepicker-toggle matIconSuffix [for]="pickerClosing"></mat-datepicker-toggle>
          <mat-datepicker #pickerClosing></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Data de liquidação</mat-label>
          <input matInput [matDatepicker]="pickerLiq" formControlName="liquidationDate">
          <mat-datepicker-toggle matIconSuffix [for]="pickerLiq"></mat-datepicker-toggle>
          <mat-datepicker #pickerLiq></mat-datepicker>
        </mat-form-field>

      </div>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="cancel()">Cancelar</button>
    <button mat-raised-button color="primary" (click)="submit()" [disabled]="form.invalid">
      <mat-icon>save</mat-icon> Salvar Contrato
    </button>
  </mat-dialog-actions>
</div>
