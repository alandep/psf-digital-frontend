<div class="auth-container">
  <mat-card class="auth-card">
    <div class="brand-header">
      <div class="brand-badge">
        <mat-icon>lock_reset</mat-icon>
      </div>
      <h1 class="brand-title">Recupere seu acesso</h1>
      <p class="brand-subtitle">Informe seu CPF ou e-mail para receber as instruções.</p>
    </div>

    <mat-card-content class="auth-content">
      <div *ngIf="submitted" class="auth-success" role="status">
        <mat-icon>mark_email_read</mat-icon>
        <span>Se encontrarmos uma conta correspondente, enviaremos as instruções de recuperação.</span>
      </div>

      <form *ngIf="!submitted" [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>CPF ou e-mail</mat-label>
          <input matInput formControlName="identifier" placeholder="Digite seu CPF ou e-mail" autocomplete="username">
          <mat-icon matPrefix>person</mat-icon>
          <mat-error *ngIf="form.get('identifier')?.hasError('required')">Campo obrigatório</mat-error>
        </mat-form-field>

        <div class="auth-actions">
          <button mat-flat-button color="primary" type="submit" class="btn-primary full-width" [disabled]="isLoading">
            <mat-spinner *ngIf="isLoading" diameter="20" class="btn-spinner"></mat-spinner>
            <span>{{ isLoading ? 'Enviando...' : 'Enviar instruções' }}</span>
          </button>
        </div>
      </form>

      <div class="auth-link-row">
        <a routerLink="/login">Voltar ao login</a>
      </div>
    </mat-card-content>
  </mat-card>
</div>
