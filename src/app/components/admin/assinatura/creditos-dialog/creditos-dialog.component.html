<div class="creditos-dialog">
  <div class="creditos-header">
    <mat-icon aria-hidden="true">auto_awesome</mat-icon>
    <h2 mat-dialog-title>Comprar pacote de créditos</h2>
  </div>

  <p class="creditos-lead">
    Pagamento único. Os créditos de IA e as páginas de OCR ficam disponíveis assim que o pagamento é confirmado.
  </p>

  <div class="scroll-area">
    <div class="loading" *ngIf="loading"><mat-spinner diameter="32"></mat-spinner></div>

    <div class="pack-list" role="radiogroup" aria-label="Pacotes de créditos" *ngIf="!loading">
      <button type="button" role="radio" class="pack-card"
              *ngFor="let p of packs; trackBy: trackByCode"
              [attr.aria-checked]="selected === p.code"
              [class.selected]="selected === p.code"
              (click)="selected = p.code">
        <span class="pack-radio">
          <mat-icon aria-hidden="true">{{ selected === p.code ? 'radio_button_checked' : 'radio_button_unchecked' }}</mat-icon>
        </span>
        <span class="pack-info">
          <span class="pack-title-row">
            <span class="pack-name">{{ p.name }}</span>
            <span class="pack-badge" *ngIf="p.highlighted">Recomendado</span>
          </span>
          <span class="pack-desc">
            +{{ p.aiCredits | number: '1.0-0':'pt-BR' }} créditos de IA e
            +{{ p.ocrPages | number: '1.0-0':'pt-BR' }} páginas OCR
          </span>
          <span class="pack-desc">válido até o fim do ciclo atual</span>
          <span class="pack-price">{{ p.amount | currency: 'BRL' }}</span>
        </span>
      </button>
    </div>

    <div class="pay-area" *ngIf="!loading && packs.length">
      <app-payment-method-form #pay
        [holderDefaults]="holder"
        [showSavedCardOption]="hasSavedCard"
        [savedCardLabel]="savedCardLabel"></app-payment-method-form>
    </div>
  </div>

  <div class="creditos-actions">
    <button mat-button [disabled]="saving" (click)="dialogRef.close()">Cancelar</button>
    <button mat-raised-button color="primary" [disabled]="!selected || saving" (click)="confirm()">
      <mat-spinner *ngIf="saving" diameter="18" class="btn-spinner"></mat-spinner>
      Confirmar compra<ng-container *ngIf="selectedPack as sp"> ({{ sp.amount | currency: 'BRL' }})</ng-container>
    </button>
  </div>
</div>
