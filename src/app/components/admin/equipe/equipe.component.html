<div class="equipe-container">

  <!-- Header Premium (identidade Portos) -->
  <div class="page-header">
    <div class="header-main">
      <div class="title-section">
        <mat-icon class="header-icon">group_add</mat-icon>
        <div class="title-content">
          <h1>Usuários da Equipe</h1>
          <p class="subtitle">Convide e gerencie os usuários da sua empresa</p>
        </div>
      </div>
      <div class="header-actions">
        <span class="ilimitado-badge">
          <mat-icon>all_inclusive</mat-icon> Usuários ilimitados — R$ 0,00 por usuário adicional
        </span>
      </div>
    </div>
  </div>

  <div class="toolbar-row">
    <button mat-raised-button color="primary" (click)="convidar()">
      <mat-icon>person_add</mat-icon> + Convidar usuário — Sem custo adicional
    </button>
  </div>

  <mat-card class="info-card">
    <mat-card-content>
      <table mat-table [dataSource]="members" class="equipe-table">
        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let m">{{ m.nome }}</td>
        </ng-container>
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>E-mail</th>
          <td mat-cell *matCellDef="let m">{{ m.email }}</td>
        </ng-container>
        <ng-container matColumnDef="perfil">
          <th mat-header-cell *matHeaderCellDef>Perfil</th>
          <td mat-cell *matCellDef="let m">{{ m.perfil }}</td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let m">
            <span class="status-chip"
                  [style.color]="statusColor(m.status).color"
                  [style.background]="statusColor(m.status).bg">
              {{ m.status }}
            </span>
          </td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let m">
            <button mat-icon-button color="warn" matTooltip="Remover usuário" (click)="remover(m)">
              <mat-icon>person_remove</mat-icon>
            </button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="cols"></tr>
        <tr mat-row *matRowDef="let row; columns: cols;"></tr>
      </table>
    </mat-card-content>
  </mat-card>

</div>
