# =============================================================================
# CI — Pull Request (e pushes de branch que NÃO seja master).
#
#   CI = PR (build/test, SEM deploy).  CD = master (push imagem + rollout + firebase).
#
# Este workflow NÃO faz deploy, NÃO faz login na GCP e NÃO cria nenhum recurso.
# Ele apenas compila, testa e constrói a imagem Docker (sem push).
# Gate bloqueante: ai-resilience-hardening 1.4/2.4/3.6/4.4 (rodam dentro de `mvn verify`).
# 5.5 (front) é best-effort (continue-on-error).
# =============================================================================
name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches-ignore: ["master"]

permissions:
  contents: read

jobs:
  # --- Backend: compile + testes (gate 1.4/2.4/3.6/4.4) ---
  backend:
    name: Backend compile/test (gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # `mvn -B verify` roda a suíte de testes, incluindo os pendentes bloqueantes
      # da spec ai-resilience-hardening: 1.4 (taxonomia de erro), 2.4 (validação de
      # resposta), 3.6 (reconciliação parcial/review), 4.4 (redação + desfecho de ledger).
      # Como não há Maven local, o CI é onde esses testes finalmente rodam.
      - name: Maven verify (inclui gate 1.4/2.4/3.6/4.4)
        run: mvn -B verify

  # --- Frontend: build de produção (gate) + testes headless (best-effort 5.5) ---
  frontend:
    name: Frontend build/test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install deps
        run: npm ci
      # Build de produção (usa environment.prod.ts: useMockServices=false,
      # bffBaseUrl=https://api.iaexport.com.br). Bloqueante.
      - name: Angular production build
        run: npx ng build --configuration=production
      # 5.5 (componente/serviço do front): best-effort — não bloqueia o CI.
      - name: Angular unit tests (headless, best-effort 5.5)
        continue-on-error: true
        run: npx ng test --watch=false --browsers=ChromeHeadless

  # --- Docker build do backend (SEM push, SEM deploy) ---
  docker-build:
    name: Docker build (sem push)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Apenas valida que o Dockerfile (novo ENTRYPOINT G1/JAVA_OPTS) compila e empacota.
      # load:false / push:false => nada é publicado em registry nenhum.
      - name: Docker build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: eip-backend:ci-${{ github.sha }}
