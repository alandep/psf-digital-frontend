# =============================================================================
# CD — push/merge na branch master.
#
#   CI = PR (build/test, SEM deploy).  CD = master (push imagem + deploy Cloud Run + firebase).
#
# ⚠️ ESTE WORKFLOW SÓ FUNCIONARÁ APÓS A INFRA SER PROVISIONADA pela IaC
#    (serviço Cloud Run `eip-backend` criado em `deploy/infra/etapa4-cloud-run/`)
#    e os vars de WIF existirem (ver `vars` abaixo — já configurados no repo).
#    O arquivo em si NÃO cria o serviço e NÃO roda em PR. Dispara apenas em push na master.
#
# Modelo de deploy: Cloud Run (o modelo GKE foi abandonado). O CD NÃO cria o serviço —
# ele apenas ATUALIZA A IMAGEM da revisão a cada push (deploy contínuo). Toda a config
# de ambiente/secrets/cloud-sql/scaling é de responsabilidade do Terraform (IaC).
#
# Autenticação na GCP: Workload Identity Federation (WIF/OIDC), SEM chave de SA
# persistente. Usa `workload_identity_provider` e `service_account` como VARS
# (identificadores, não segredos). Nunca `credentials_json`.
#
# Imagem: SEMPRE `eip-backend:${{ github.sha }}` em southamerica-east1. NUNCA `latest`.
#
# Migrations NÃO rodam no CD: são um passo administrativo separado (Cloud Run Job/manual).
# O CD só faz build + push + deploy do serviço (nova revisão) + deploy do frontend.
#
# Gate: os mesmos testes bloqueantes do CI (1.4/2.4/3.6/4.4) rodam antes do deploy.
# =============================================================================
name: CD

on:
  push:
    branches: ["master"]

permissions:
  contents: read
  id-token: write   # necessário para WIF/OIDC

env:
  PROJECT_ID: eip-ai-prod
  REGION: southamerica-east1
  AR_REPO: eip-backend
  IMAGE_NAME: eip-backend
  SERVICE_NAME: eip-backend
  RUNTIME_SA: eip-run@eip-ai-prod.iam.gserviceaccount.com   # runtime SA do serviço Cloud Run (criada pela IaC)
  FIREBASE_PROJECT: eip-ai-prod                             # projeto Firebase (frontend iaexport.com.br)

jobs:
  # ---------------------------------------------------------------------------
  # 1) GATE — mesmos checks do CI (bloqueia o deploy).
  # ---------------------------------------------------------------------------
  gate:
    name: Gate de testes (backend + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven verify (gate 1.4/2.4/3.6/4.4)
        working-directory: backend
        run: mvn -B verify
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Angular production build
        run: npx ng build --configuration=production
      - name: Angular unit tests (headless, best-effort 5.5)
        continue-on-error: true
        run: npx ng test --watch=false --browsers=ChromeHeadless

  # ---------------------------------------------------------------------------
  # 2) BUILD + PUSH — imagem eip-backend:<git-sha> no Artifact Registry.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & push (Artifact Registry)
    runs-on: ubuntu-latest
    needs: [gate]
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      # Auth via WIF/OIDC — sem key.json. Vars já configuradas no repo.
      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          # Caminho do provider WIF, ex.:
          # projects/<PROJECT_NUMBER>/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - name: Compute image ref
        id: meta
        run: echo "image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Tag = github.sha. NUNCA latest.
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.image }}

  # ---------------------------------------------------------------------------
  # 3) DEPLOY BACKEND — nova revisão no Cloud Run com a imagem :<sha>.
  #
  # O serviço `eip-backend` JÁ EXISTE (criado pela IaC em etapa4-cloud-run/).
  # Aqui o CD apenas aponta a nova imagem: `gcloud run deploy` com a imagem
  # recém-publicada cria uma NOVA REVISÃO e migra 100% do tráfego por padrão.
  #
  # As configs de env/secrets/cloud-sql/scaling/min-instances já estão no serviço
  # (definidas pelo Terraform) e são PRESERVADAS entre revisões — por isso NÃO
  # repassamos --set-env-vars/--set-secrets aqui (evita divergência com a IaC;
  # o CD só troca a imagem). Se futuramente o CD precisar mudar config, isso deve
  # ser feito via Terraform, nunca no gcloud do CD.
  #
  # Sem GKE, sem kubectl, sem manifests k8s. Migrations NÃO rodam aqui.
  # ---------------------------------------------------------------------------
  deploy-backend:
    name: Deploy backend (Cloud Run)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
      # Nova revisão com a imagem deste commit (:<sha>). A runtime SA é a `eip-run`
      # (a SA de deploy `deployer` tem iam.serviceAccountUser sobre ela — IaC roles_deployer.tf).
      - name: Deploy nova revisão (Cloud Run)
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ needs.build-and-push.outputs.image }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --service-account ${{ env.RUNTIME_SA }} \
            --quiet
      # Passo informativo: consulta o status da condição principal do serviço.
      # Não bloqueia o pipeline (|| true) — apenas registra a saúde da revisão.
      - name: Verificar revisão
        run: |
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format='value(status.conditions[0].status)' || true

  # ---------------------------------------------------------------------------
  # 4) DEPLOY FRONTEND — Firebase Hosting (iaexport.com.br), autenticado por WIF/OIDC.
  # ---------------------------------------------------------------------------
  deploy-frontend:
    name: Deploy frontend (Firebase Hosting)
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Angular production build
        run: npx ng build --configuration=production
      # Auth via WIF/OIDC — sem token/key persistente de Firebase.
      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      # firebase-tools usa o ADC obtido via WIF (GOOGLE_APPLICATION_CREDENTIALS exportado pelo auth).
      - name: Firebase deploy (hosting)
        run: npx -y firebase-tools@latest deploy --only hosting --project ${{ env.FIREBASE_PROJECT }} --non-interactive
