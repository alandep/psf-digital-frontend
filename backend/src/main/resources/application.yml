# EIP backend configuration.
# Profiles: local (default active for development), cloud (Cloud Run).
spring:
  application:
    name: eip-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eip}
    username: ${DB_USER:eip}
    password: ${DB_PASSWORD:eip}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
      pool-name: eip-pool
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  mail:
    # Only used when eip.mail.enabled=true. Brevo free: smtp-relay.brevo.com:587.
    host: ${EIP_MAIL_HOST:}
    port: ${EIP_MAIL_PORT:587}
    username: ${EIP_MAIL_USER:}
    password: ${EIP_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${EIP_MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${EIP_MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    mail:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

eip:
  # Transactional e-mail (MFA codes, invitations, password reset).
  mail:
    enabled: ${EIP_MAIL_ENABLED:false}
    from: ${EIP_MAIL_FROM:no-reply@localhost}
    from-name: ${EIP_MAIL_FROM_NAME:EIP}
    # Logs the message body (codes/links). NEVER enable in production.
    log-body: ${EIP_MAIL_LOG_BODY:false}
  app:
    # Public URL of the SPA, used to build links sent by e-mail.
    base-url: ${EIP_APP_BASE_URL:http://localhost:4200}
  auth:
    # DEV ONLY: also return activation links in API responses (never in cloud).
    expose-dev-links: ${EIP_EXPOSE_DEV_LINKS:false}
    # DEV ONLY: unknown identifiers fall back to the seeded user.
    dev-fallback-user: ${EIP_AUTH_DEV_FALLBACK:false}
    max-password-attempts: 5
    lock-minutes: 15
    mfa:
      code-ttl-minutes: 10
      max-attempts: 5
      resend-cooldown-seconds: 60
      max-sends: 5
  # CORS / cookie security knobs for the browser BFF flow.
  #
  # Base defaults are LOCAL-SAFE: the Angular dev server runs same-origin behind
  # the dev proxy (proxy.conf.json) or at http://localhost:4200, so the hardened
  # cookie attributes MUST stay off here (Secure/SameSite would break plain
  # http://localhost). The cloud profile (application-cloud.yml) overrides these
  # for the DEGUSTAÇÃO (iaexport.com.br/Firebase -> Cloud Run run.app), which is
  # cross-origin AND CROSS-SITE (different registrable domains) → SameSite=None + Secure.
  cors:
    # Comma-separated allowlist. NEVER "*": credentials require a specific origin.
    allowed-origins: ${EIP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    # Comma-separated e-mails (case-insensitive) granted Super Admin screens.
    super-admin-emails: ${EIP_SUPER_ADMIN_EMAILS:}
    # DEV ONLY: any ADMINISTRADOR is Super Admin (true in the local profile).
    super-admin-any-admin: false
    # AES-256 key (base64, 32 bytes) protecting TOTP secrets at rest.
    # REQUIRED in the cloud profile. Generate: openssl rand -base64 32
    mfa-encryption-key: ${EIP_MFA_ENCRYPTION_KEY:}
    # When true, a missing key aborts startup (no DEV fallback key). true in cloud.
    mfa-key-required: ${EIP_MFA_KEY_REQUIRED:false}
    cookie:
      # When true (DEGUSTAÇÃO/cloud), the session + CSRF cookies are hardened with Secure and
      # SameSite=None for the cross-site HTTPS flow (frontend iaexport.com.br/Firebase and
      # backend run.app/Cloud Run have DIFFERENT registrable domains → cross-site, so None is
      # MANDATORY; Lax would not be sent cross-site). MUST stay false locally (plain HTTP,
      # same-origin): leaving it off avoids forcing Secure/SameSite and breaking
      # http://localhost. Flipped to true in the cloud profile. FUTURO: ao migrar para
      # api.iaexport.com.br (same-site), volta-se a SameSite=Lax.
      cross-site: ${EIP_COOKIE_CROSS_SITE:false}
  ai:
    worker:
      poll-ms: 5000
    # Versioned AI price table (FinOps). Lives under the base eip.ai section so it
    # applies to ALL profiles (mock/demo included) and needs no DB migration.
    # Consumed by AiPriceCatalogPort to compute ai_usage_event.provider_cost.
    # A price change is a config change only (bump `version` + edit a rate) — no deploy.
    # NOTE: the numbers below are ILLUSTRATIVE placeholders and MUST be confirmed
    # against Google's official Vertex AI price sheet before go-live.
    # Rates are USD per 1,000,000 tokens. Keys are quoted because they contain a colon.
    pricing:
      version: "2026-01"
      rates:
        "vertex-ai:gemini-3.8-flash":
          input-per-million: 0.075
          output-per-million: 0.30
          thinking-per-million: 0.30
  document:
    worker:
      poll-ms: 7000
  # Read-only reporting datasource for Super Admin cross-tenant analytics.
  # Uses the eip_report role (BYPASSRLS, SELECT-only) provisioned by V17.
  # Defaults point at the same database as the main datasource.
  reporting:
    datasource:
      url: ${REPORTING_DATASOURCE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eip}}
      username: ${REPORTING_DB_USER:eip_report}
      password: ${REPORTING_DB_PASSWORD:eip_report}

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    hibernate:
      ddl-auto: none
  mail:
    host: ${EIP_MAIL_HOST:mailpit}
    port: ${EIP_MAIL_PORT:1025}
    username: ${EIP_MAIL_USER:}
    password: ${EIP_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${EIP_MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${EIP_MAIL_STARTTLS:false}

eip:
  mail:
    enabled: ${EIP_MAIL_ENABLED:true}
    log-body: ${EIP_MAIL_LOG_BODY:true}
  auth:
    expose-dev-links: true
  security:
    super-admin-any-admin: true

logging:
  level:
    com.eip: DEBUG
