# EIP backend configuration.
# Profiles: local (default active for development), cloud (Cloud Run).
spring:
  application:
    name: eip-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eip}
    username: ${DB_USER:eip}
    password: ${DB_PASSWORD:eip}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
      pool-name: eip-pool
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local

logging:
  level:
    com.eip: DEBUG
