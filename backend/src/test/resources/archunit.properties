# ArchUnit FreezingArchRule baseline (see ArchitectureTests).
# The store is versioned; CI never creates it implicitly (a missing store fails).
# To create it the first time: mvn test -Dtest=ArchitectureTests -Darchunit.freeze.store.default.allowStoreCreation=true
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=false
freeze.refreeze=false
