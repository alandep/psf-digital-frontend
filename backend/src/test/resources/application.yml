# Test profile configuration.
# The datasource is supplied dynamically by PostgresIT (@DynamicPropertySource)
# from the Testcontainers PostgreSQL 16 instance, so no URL is hard-coded here.
spring:
  jpa:
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates the mapping matches.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

logging:
  level:
    root: WARN
    com.eip: INFO
    org.testcontainers: WARN
    org.flywaydb: WARN
