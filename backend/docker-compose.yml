services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/eip
      DB_USER: eip
      DB_PASSWORD: eip
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: eip
      POSTGRES_USER: eip
      POSTGRES_PASSWORD: eip
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eip -d eip"]
      interval: 10s
      timeout: 5s
      retries: 5

