services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/eip
      DB_USER: eip
      DB_PASSWORD: eip
      EIP_APP_BASE_URL: http://localhost:4200
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: eip
      POSTGRES_USER: eip
      POSTGRES_PASSWORD: eip
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eip -d eip"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local SMTP sink: every e-mail (MFA codes, invitations) shows up at
  # http://localhost:8025. The local profile points spring.mail at mailpit:1025.
  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "8025:8025"
      - "1025:1025"

  # redis:
